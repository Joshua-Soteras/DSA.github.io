<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Visualizers</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060606; }
    #root { display: flex; flex-direction: column; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback } = React;

    // ─────────────────────────────────────────────────────────────────────────────
    // TOPIC REGISTRY
    // To add a new visualizer: define the component below, then add one entry here.
    // ─────────────────────────────────────────────────────────────────────────────

    const TOPICS = [
      { id: "decimal-to-binary", label: "Decimal → Binary", tag: "Conversion", component: () => <DecimalToBinary /> },
      { id: "twos-complement", label: "Two's Complement", tag: "Binary", component: () => <TwosComplement /> },
      { id: "union-find", label: "Union-Find",    tag: "LC 684",  component: () => <UnionFindVisualizer /> },
      { id: "bit-ops",    label: "Bit Operations", tag: "Python",  component: () => <BitOps /> },
      // { id: "two-pointers", label: "Two Pointers", tag: "LC 15", component: () => <TwoPointers /> },
    ];

    const DEFAULT_TOPIC_ID = "twos-complement";

    // ─────────────────────────────────────────────────────────────────────────────
    // NAV SHELL
    // ─────────────────────────────────────────────────────────────────────────────

    const NAV_STYLE = {
      nav: {
        display: "flex",
        alignItems: "center",
        gap: 4,
        padding: "10px 20px",
        background: "#060606",
        borderBottom: "1px solid #1a1a1a",
        overflowX: "auto",
        flexShrink: 0,
      },
      wordmark: {
        fontFamily: "'IBM Plex Mono', 'Fira Code', monospace",
        fontSize: 12,
        fontWeight: 700,
        letterSpacing: "0.12em",
        color: "#38bdf8",
        marginRight: 16,
        whiteSpace: "nowrap",
      },
      tab: (active) => ({
        fontFamily: "'IBM Plex Mono', 'Fira Code', monospace",
        fontSize: 12,
        padding: "5px 14px",
        borderRadius: 6,
        border: `1px solid ${active ? "#1e4060" : "#1a1a1a"}`,
        background: active ? "#0c1f33" : "transparent",
        color: active ? "#38bdf8" : "#4a5568",
        cursor: "pointer",
        whiteSpace: "nowrap",
        display: "flex",
        alignItems: "center",
        gap: 6,
        transition: "all .15s",
      }),
      tag: (active) => ({
        fontSize: 10,
        padding: "1px 6px",
        borderRadius: 99,
        background: active ? "#1e4060" : "#111",
        color: active ? "#7dd3fc" : "#374151",
      }),
    };

    function Nav({ active, onChange }) {
      return (
        <nav style={NAV_STYLE.nav}>
          <span style={NAV_STYLE.wordmark}>DSA</span>
          {TOPICS.map(t => (
            <button key={t.id} style={NAV_STYLE.tab(active === t.id)} onClick={() => onChange(t.id)}>
              {t.label}
              <span style={NAV_STYLE.tag(active === t.id)}>{t.tag}</span>
            </button>
          ))}
        </nav>
      );
    }

    function App() {
      const [active, setActive] = useState(DEFAULT_TOPIC_ID);
      const topic = TOPICS.find(t => t.id === active);
      const View = topic.component;
      return (
        <>
          <Nav active={active} onChange={setActive} />
          <View />
        </>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // VISUALIZER 1 — Union-Find (LeetCode 684: Redundant Connection)
    // ─────────────────────────────────────────────────────────────────────────────

    const UF_COLORS = {
      teal:  { bg: "#e1f5ee", border: "#0f6e56", text: "#085041" },
      blue:  { bg: "#e6f1fb", border: "#185fa5", text: "#0c447c" },
      amber: { bg: "#faeeda", border: "#ba7517", text: "#633806" },
      gray:  { bg: "#f1efe8", border: "#5f5e5a", text: "#444441" },
      red:   { bg: "#fcebeb", border: "#a32d2d", text: "#791f1f" },
      green: { bg: "#eaf3de", border: "#3b6d11", text: "#27500a" },
    };

    const UF_R = 22;

    function UFNode({ x, y, label, color = "blue", r = UF_R }) {
      const c = UF_COLORS[color];
      return (
        <g>
          <circle cx={x} cy={y} r={r} fill={c.bg} stroke={c.border} strokeWidth="1.5" />
          <text x={x} y={y} textAnchor="middle" dominantBaseline="central"
            fontSize="15" fontWeight="500" fontFamily="inherit" fill={c.text}>
            {label}
          </text>
        </g>
      );
    }

    function UFArrow({ x1, y1, x2, y2, color, sw = 1.5 }) {
      const dx = x2 - x1, dy = y2 - y1;
      const L = Math.hypot(dx, dy);
      const p = UF_R + 4;
      const sx = x1 + p * dx / L, sy = y1 + p * dy / L;
      const ex = x2 - p * dx / L, ey = y2 - p * dy / L;
      return (
        <line x1={sx.toFixed(1)} y1={sy.toFixed(1)} x2={ex.toFixed(1)} y2={ey.toFixed(1)}
          stroke={color} strokeWidth={sw}
          markerEnd="url(#uf-mk)" />
      );
    }

    function UFLabel({ x, y, children, color = "#6b7280", size = 11, anchor = "middle" }) {
      return (
        <text x={x} y={y} textAnchor={anchor} fontSize={size}
          fontFamily="inherit" fill={color}>{children}</text>
      );
    }

    function UFSvgDefs() {
      return (
        <defs>
          <marker id="uf-mk" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
            <path d="M2 2L8 5L2 8" fill="none" stroke="context-stroke"
              strokeWidth="1.5" strokeLinecap="round" />
          </marker>
        </defs>
      );
    }

    const UF = {
      wrapper: {
        fontFamily: "'IBM Plex Mono', 'Fira Code', 'Courier New', monospace",
        background: "#0a0a0f",
        color: "#e2e8f0",
        minHeight: "100vh",
        padding: "2rem 1rem",
      },
      container: { maxWidth: 860, margin: "0 auto" },
      header: { marginBottom: "2.5rem", borderBottom: "1px solid #1e2d45", paddingBottom: "1.5rem" },
      tag: {
        display: "inline-block", fontSize: 11, fontWeight: 700, letterSpacing: "0.1em",
        color: "#38bdf8", background: "#0c2340", border: "1px solid #1e4060",
        borderRadius: 4, padding: "3px 10px", marginBottom: 12,
      },
      h1: { fontSize: "clamp(1.4rem,4vw,2rem)", fontWeight: 700, color: "#f0f6ff", margin: "0 0 8px" },
      subtitle: { fontSize: 13, color: "#64748b", margin: 0, lineHeight: 1.6 },
      section: { marginBottom: "2.5rem" },
      sectionHead: {
        display: "flex", alignItems: "center", gap: 10,
        marginBottom: 16, fontSize: 12, fontWeight: 700,
        letterSpacing: "0.08em", color: "#38bdf8", textTransform: "uppercase",
      },
      sectionLine: { flex: 1, height: 1, background: "#1e2d45" },
      card: {
        background: "#0f172a", border: "1px solid #1e2d45",
        borderRadius: 12, overflow: "hidden",
      },
      stepNav: {
        display: "flex", alignItems: "center", gap: 12,
        padding: "12px 20px", borderTop: "1px solid #1e2d45",
      },
      btn: {
        background: "transparent", border: "1px solid #1e4060",
        borderRadius: 6, color: "#38bdf8", fontSize: 12,
        fontFamily: "inherit", padding: "6px 14px",
        cursor: "pointer", transition: "all .15s",
      },
      btnDisabled: { opacity: 0.3, cursor: "not-allowed" },
      badge: {
        fontSize: 11, color: "#64748b",
        background: "#0a0a0f", border: "1px solid #1e2d45",
        borderRadius: 99, padding: "3px 12px",
      },
      stepTitle: {
        padding: "14px 20px 10px",
        fontSize: 12, fontWeight: 700, letterSpacing: "0.06em",
        color: "#94a3b8", borderBottom: "1px solid #1e2d45",
      },
      desc: {
        padding: "14px 20px", fontSize: 13, lineHeight: 1.8,
        color: "#94a3b8", borderTop: "1px solid #1e2d45",
      },
      code: {
        fontFamily: "inherit", fontSize: 12,
        background: "#0a0a0f", border: "1px solid #1e2d45",
        borderRadius: 4, padding: "2px 6px", color: "#7dd3fc",
      },
      codeBlock: {
        margin: "0", padding: "16px 20px",
        background: "#060a12", fontSize: 12, lineHeight: 2,
        overflowX: "auto", fontFamily: "inherit",
      },
      hlLine: { background: "#1a2a0a", color: "#86efac", display: "block", margin: "0 -20px", padding: "0 20px" },
      normLine: { color: "#4a5568", display: "block" },
      progress: { flex: 1, height: 2, background: "#1e2d45", borderRadius: 2, overflow: "hidden" },
      progressFill: { height: "100%", background: "#38bdf8", borderRadius: 2, transition: "width .35s" },
      ufGrid: { display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8, padding: "14px 20px" },
      ufCell: (isRoot, isActive) => ({
        borderRadius: 8, padding: "8px 6px", textAlign: "center",
        border: `1px solid ${isRoot ? "#0f6e56" : isActive ? "#ba7517" : "#1e2d45"}`,
        background: isRoot ? "#04342c" : isActive ? "#412402" : "#0a0a0f",
        fontFamily: "inherit", fontSize: 12, transition: "all .4s",
      }),
      ufCellLabel: (isRoot, isActive) => ({
        fontSize: 11, marginBottom: 3, opacity: 0.6,
        color: isRoot ? "#5dcaa5" : isActive ? "#ef9f27" : "#64748b",
      }),
      ufCellVal: (isRoot, isActive) => ({
        fontWeight: 700, color: isRoot ? "#9fe1cb" : isActive ? "#fac775" : "#94a3b8",
      }),
      traceBox: {
        margin: "0 20px 14px", padding: "10px 14px",
        background: "#060a12", border: "1px solid #1e2d45",
        borderRadius: 8, fontSize: 12, lineHeight: 1.9,
        color: "#94a3b8", fontFamily: "inherit", minHeight: 52,
      },
    };

    const UF_ALGO_NODES = [
      { id: 1, x: 340, y: 50 },
      { id: 2, x: 130, y: 200 },
      { id: 3, x: 550, y: 200 },
      { id: 4, x: 340, y: 340 },
    ];
    const UF_ALGO_EDGES = [[1, 2], [1, 3], [3, 4], [2, 4]];

    const UF_ALGO_STEPS = [
      {
        label: "Initial state",
        shown: [], eState: {}, parent: [null, 1, 2, 3, 4], active: [],
        cHl: [0],
        trace: "parent = [_, 1, 2, 3, 4]\nEach node is its own root.",
        desc: "We have 4 nodes and 4 edges. A tree with n nodes only needs n−1 edges — so with n edges, exactly one is redundant (creates a cycle). Initialize parent[i] = i. We process each edge and use Union-Find to detect a cycle.",
      },
      {
        label: "Edge [1, 2]",
        shown: [0], eState: { 0: "united" }, parent: [null, 1, 1, 3, 4], active: [1, 2],
        cHl: [7, 8, 10],
        trace: "find(1) → parent[1]=1 → root = 1\nfind(2) → parent[2]=2 → root = 2\n1 ≠ 2  →  no cycle  →  union(1, 2)",
        desc: "find(1) = 1 and find(2) = 2 — different roots, no cycle. Union: set parent[2] = 1. Nodes 1 and 2 now share a component.",
      },
      {
        label: "Edge [1, 3]",
        shown: [0, 1], eState: { 0: "united", 1: "united" }, parent: [null, 1, 1, 1, 4], active: [1, 3],
        cHl: [7, 8, 10],
        trace: "find(1) → parent[1]=1 → root = 1\nfind(3) → parent[3]=3 → root = 3\n1 ≠ 3  →  no cycle  →  union(1, 3)",
        desc: "find(1) = 1 and find(3) = 3 — different roots, no cycle. Union: set parent[3] = 1. Nodes 1, 2, and 3 now share a component.",
      },
      {
        label: "Edge [3, 4]",
        shown: [0, 1, 2], eState: { 0: "united", 1: "united", 2: "united" }, parent: [null, 1, 1, 1, 1], active: [3, 4],
        cHl: [3, 4, 5, 7, 8, 10],
        trace: "find(3) → parent[3]=1 → find(1)=1 → root = 1  ✦ path compressed!\nfind(4) → parent[4]=4 → root = 4\n1 ≠ 4  →  no cycle  →  union(1, 4)",
        desc: "find(3): parent[3]=1, recurse → root is 1. Path compression makes future lookups O(1). find(4) = 4. Union: set parent[4] = 1. All 4 nodes now in one component.",
      },
      {
        label: "Edge [2, 4] — CYCLE DETECTED",
        shown: [0, 1, 2, 3], eState: { 0: "united", 1: "united", 2: "united", 3: "redundant" },
        parent: [null, 1, 1, 1, 1], active: [2, 4],
        cHl: [7, 8, 9],
        trace: "find(2) → parent[2]=1 → root = 1\nfind(4) → parent[4]=1 → root = 1\n1 === 1  →  SAME ROOT  →  cycle found!",
        desc: "find(2) = 1 and find(4) = 1 — both return the same root! These nodes are already connected. Adding this edge creates a cycle. Answer: return [2, 4].",
      },
    ];

    const UF_CODE_LINES = [
      "parent = list(range(n + 1))",
      "",
      "def find(x):",
      "    if parent[x] != x:",
      "        parent[x] = find(parent[x])  # path compression",
      "    return parent[x]",
      "",
      "for u, v in edges:",
      "    if find(u) == find(v):",
      "        return [u, v]  # ← redundant edge!",
      "    parent[find(u)] = find(v)  # union",
    ];

    const UF_SOLUTION = `class Solution:
    def findRedundantConnection(self, edges):
        n = len(edges)
        parent = list(range(n + 1))
        rank   = [0] * (n + 1)

        def find(x):
            if parent[x] != x:
                parent[x] = find(parent[x])  # path compression
            return parent[x]

        def union(x, y):
            rx, ry = find(x), find(y)
            if rx == ry:
                return False             # same root = cycle!
            if rank[rx] < rank[ry]:
                rx, ry = ry, rx
            parent[ry] = rx              # attach smaller under larger
            if rank[rx] == rank[ry]:
                rank[rx] += 1
            return True

        for u, v in edges:
            if not union(u, v):
                return [u, v]            # this edge caused the cycle`;

    function ufNpos(id) { return UF_ALGO_NODES.find(n => n.id === id); }

    function AlgoGraph({ step }) {
      return (
        <svg width="100%" viewBox="0 0 680 390" style={{ display: "block" }}>
          <UFSvgDefs />
          {UF_ALGO_EDGES.map((e, i) => {
            const shown = step.shown.includes(i);
            const st = step.eState[i];
            if (!shown) return (
              <line key={i}
                x1={ufNpos(e[0]).x} y1={ufNpos(e[0]).y}
                x2={ufNpos(e[1]).x} y2={ufNpos(e[1]).y}
                stroke="#1e2d45" strokeWidth="1.5" opacity="0.4" />
            );
            const col = st === "redundant" ? "#ef4444" : "#10b981";
            const n1 = ufNpos(e[0]), n2 = ufNpos(e[1]);
            const dx = n2.x - n1.x, dy = n2.y - n1.y;
            const L = Math.hypot(dx, dy), p = UF_R + 4;
            return (
              <g key={i}>
                <line
                  x1={(n1.x + p * dx / L).toFixed(1)} y1={(n1.y + p * dy / L).toFixed(1)}
                  x2={(n2.x - p * dx / L).toFixed(1)} y2={(n2.y - p * dy / L).toFixed(1)}
                  stroke={col} strokeWidth={st === "redundant" ? 3 : 2.5}
                  strokeDasharray={st === "redundant" ? "6 3" : ""}
                  markerEnd="url(#uf-mk)" />
                <text
                  x={(n1.x + n2.x) / 2 - (n2.y - n1.y) / L * 18}
                  y={(n1.y + n2.y) / 2 + (n2.x - n1.x) / L * 18}
                  textAnchor="middle" dominantBaseline="central"
                  fontSize="11" fontFamily="inherit" fill={col}>
                  [{e[0]},{e[1]}]
                </text>
              </g>
            );
          })}
          {UF_ALGO_NODES.map(n => (
            <UFNode key={n.id} x={n.x} y={n.y} label={n.id}
              color={step.active.includes(n.id) ? "amber" : "blue"} />
          ))}
        </svg>
      );
    }

    function AlgoDemo() {
      const [cur, setCur] = useState(0);
      const step = UF_ALGO_STEPS[cur];
      return (
        <div style={UF.section}>
          <div style={UF.sectionHead}>
            <span>Algorithm walkthrough</span>
            <div style={UF.sectionLine} />
          </div>
          <div style={UF.card}>
            <div style={UF.stepTitle}>{step.label}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0 }}>
              <div style={{ borderRight: "1px solid #1e2d45" }}>
                <AlgoGraph step={step} />
              </div>
              <div style={{ padding: "14px 20px", display: "flex", flexDirection: "column", gap: 14 }}>
                <div>
                  <div style={{ fontSize: 11, color: "#38bdf8", fontWeight: 700, letterSpacing: "0.08em", marginBottom: 8 }}>PARENT[ ] ARRAY</div>
                  <div style={UF.ufGrid}>
                    {[1, 2, 3, 4].map(i => {
                      const isRoot = step.parent[i] === i;
                      const isActive = step.active.includes(i);
                      return (
                        <div key={i} style={UF.ufCell(isRoot, isActive)}>
                          <div style={UF.ufCellLabel(isRoot, isActive)}>node {i}</div>
                          <div style={UF.ufCellVal(isRoot, isActive)}>
                            parent={step.parent[i]}
                            {isRoot && <div style={{ fontSize: 10, opacity: 0.7 }}>★ root</div>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: 11, color: "#38bdf8", fontWeight: 700, letterSpacing: "0.08em", marginBottom: 8 }}>FIND( ) TRACE</div>
                  <div style={UF.traceBox}>
                    {step.trace.split("\n").map((l, i) => (
                      <div key={i} style={{ color: l.includes("SAME") || l.includes("cycle") ? "#f87171" : "#64748b" }}>{l}</div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
            <div style={{ borderTop: "1px solid #1e2d45" }}>
              <pre style={UF.codeBlock}>
                {UF_CODE_LINES.map((line, i) => (
                  <span key={i} style={step.cHl.includes(i) ? UF.hlLine : UF.normLine}>
                    {line || " "}
                  </span>
                ))}
              </pre>
            </div>
            <div style={UF.desc}>{step.desc}</div>
            <div style={UF.stepNav}>
              <button style={{ ...UF.btn, ...(cur === 0 ? UF.btnDisabled : {}) }}
                onClick={() => setCur(c => Math.max(0, c - 1))} disabled={cur === 0}>
                ← prev
              </button>
              <div style={UF.progress}>
                <div style={{ ...UF.progressFill, width: `${(cur + 1) / UF_ALGO_STEPS.length * 100}%` }} />
              </div>
              <span style={UF.badge}>{cur + 1} / {UF_ALGO_STEPS.length}</span>
              <div style={UF.progress}><div style={{ width: 0 }} /></div>
              <button style={{ ...UF.btn, ...(cur === UF_ALGO_STEPS.length - 1 ? UF.btnDisabled : {}) }}
                onClick={() => setCur(c => Math.min(UF_ALGO_STEPS.length - 1, c + 1))}
                disabled={cur === UF_ALGO_STEPS.length - 1}>
                next →
              </button>
            </div>
          </div>
        </div>
      );
    }

    function UF_Eli5Step1() {
      return (
        <svg width="100%" viewBox="0 0 680 290" style={{ display: "block" }}>
          <UFSvgDefs />
          <UFNode x={340} y={60} label={1} color="teal" />
          <UFLabel x={340} y={94} color="#5dcaa5" size={11}>★  root — boss of everyone  (parent[1] = 1)</UFLabel>
          <UFNode x={130} y={210} label={2} color="blue" />
          <UFLabel x={130} y={246} color="#64748b" size={11}>parent[2] = 1</UFLabel>
          <UFNode x={340} y={210} label={3} color="blue" />
          <UFLabel x={340} y={246} color="#64748b" size={11}>parent[3] = 1</UFLabel>
          <UFNode x={550} y={210} label={4} color="blue" />
          <UFLabel x={550} y={246} color="#64748b" size={11}>parent[4] = 1</UFLabel>
          <UFArrow x1={130} y1={210} x2={340} y2={60} color="#185fa5" />
          <UFArrow x1={340} y1={210} x2={340} y2={60} color="#185fa5" />
          <UFArrow x1={550} y1={210} x2={340} y2={60} color="#185fa5" />
          <UFLabel x={340} y={275} color="#334155" size={11}>every node stores one number: "my boss is ___"</UFLabel>
        </svg>
      );
    }

    function UF_Eli5Step2() {
      return (
        <svg width="100%" viewBox="0 0 680 440" style={{ display: "block" }}>
          <UFSvgDefs />
          <UFNode x={340} y={50} label={1} color="teal" />
          <UFLabel x={340} y={84} color="#5dcaa5" size={10}>ROOT</UFLabel>
          <UFNode x={340} y={165} label={2} color="blue" />
          <UFNode x={340} y={280} label={3} color="blue" />
          <UFNode x={340} y={395} label={4} color="amber" />
          <UFArrow x1={340} y1={395} x2={340} y2={280} color="#b45309" sw={2.5} />
          <UFArrow x1={340} y1={280} x2={340} y2={165} color="#b45309" sw={2.5} />
          <UFArrow x1={340} y1={165} x2={340} y2={50}  color="#b45309" sw={2.5} />
          <UFLabel x={480} y={395} color="#ef9f27" size={12} anchor="start">← start: find(4)</UFLabel>
          <UFLabel x={480} y={330} color="#ef9f27" size={11} anchor="start">step 1: 4 → 3</UFLabel>
          <UFLabel x={480} y={215} color="#ef9f27" size={11} anchor="start">step 2: 3 → 2</UFLabel>
          <UFLabel x={480} y={100} color="#86efac" size={11} anchor="start">step 3: 2 → 1  ✓ root!</UFLabel>
        </svg>
      );
    }

    function UF_Eli5Step3() {
      return (
        <svg width="100%" viewBox="0 0 680 545" style={{ display: "block" }}>
          <UFSvgDefs />
          <UFNode x={340} y={45}  label={1} color="teal" />

    function toBin(n, bits = 8) {
      if (n < 0) return ((n >>> 0) & 0xff).toString(2).padStart(bits, "0");
      return (n >>> 0).toString(2).slice(-bits).padStart(bits, "0");
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // VISUALIZER 3 — Two's Complement (Binary refresher + converter)
    // ─────────────────────────────────────────────────────────────────────────────

    function tcClamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }

    function tcDecToBits(dec) {
      const byte = dec & 0xff;
      return Array.from({ length: 8 }, (_, i) => (byte >> (7 - i)) & 1);
    }

    function tcBitsToDec(bits) {
      const unsigned = bits.reduce((acc, b) => (acc << 1) | b, 0);
      return bits[0] === 1 ? unsigned - 256 : unsigned;
    }

    function tcFlipBits(bits) { return bits.map(b => b ^ 1); }

    function tcAddOneBits(bits) {
      const result = [...bits];
      let carry = 1;
      for (let i = result.length - 1; i >= 0 && carry; i--) {
        const sum = result[i] + carry;
        result[i] = sum % 2;
        carry = sum >= 2 ? 1 : 0;
      }
      return result;
    }

    function tcDiffBits(a, b) { return a.map((v, i) => v !== b[i]); }

    function tcBuildCarrySteps(startDec) {
      const POW = [128, 64, 32, 16, 8, 4, 2, 1];
      const startBits = tcDecToBits(startDec);
      const n = startBits.length;
      const steps = [{
        bits: [...startBits], highlight: -1, carryTarget: n - 1, arithmetic: null, label: "start",
        desc: `We're computing ${startDec} + 1. Binary addition works right to left — the +1 enters ` +
              `at the rightmost bit (the 1s place).`,
      }];
      let working = [...startBits];
      let carry = 1;
      for (let i = n - 1; i >= 0 && carry; i--) {
        const before = working[i];
        const sum = before + carry;
        const writeBit = sum % 2;
        const carryOut = sum >= 2 ? 1 : 0;
        working = [...working];
        working[i] = writeBit;
        steps.push({
          bits: [...working], highlight: i,
          carryTarget: carryOut === 1 && i > 0 ? i - 1 : null,
          arithmetic: { before, carryIn: carry, sum, writeBit, carryOut },
          label: `bit worth ${POW[i]}`,
          desc: before === 1
            ? `This bit is 1 and the incoming carry is 1: 1 + 1 = "10" in binary — write 0 here, ` +
              `and carry a 1 into the next bit to the left.`
            : `This bit is 0 and the incoming carry is 1: 0 + 1 = 1 — write 1 here. There's nothing ` +
              `left to carry, so the ripple stops.`,
        });
        carry = carryOut;
      }
      steps.push({
        bits: [...working], highlight: -1, carryTarget: null, arithmetic: null, label: "done",
        desc: `No carry left, so every bit further left stays the same. ${startDec} + 1 = ${tcBitsToDec(working)}.`,
      });
      return steps;
    }

    function tcBuildDivideSteps(startDec) {
      const rows = [];
      let q = startDec;
      do {
        const next = Math.floor(q / 2);
        const rem = q % 2;
        rows.push({ dividend: q, quotient: next, remainder: rem });
        q = next;
      } while (q > 0);
      return rows;
    }

                <div style={S.subcardLabel}>DECIMAL</div>
                <div style={S.decimalRow}>
                  <button style={S.signToggle(isNeg)} onClick={onToggleSign} aria-label="toggle sign">
                    {isNeg ? "−" : "+"}
                  </button>
                  <input
                    type="number" min={0} max={maxMagnitude} value={magnitude}
                    onChange={onMagnitudeChange} style={S.decimalInput}
                  />
                </div>
                <div style={S.decimalBig}>value = <span style={S.decimalBigVal(isNeg)}>{value}</span></div>
              </div>
              <div style={{ ...S.subcard, ...S.subcardDivider }}>
                <div style={S.subcardLabel}>BINARY (two's complement)</div>
                <div style={S.bitsRow}>
                  {bits.map((b, i) => (
                    <button key={i} style={S.bitCell(b === 1, i === 0)} onClick={() => onBitToggle(i)}>
                      {b}
                    </button>
                  ))}
                </div>
                <div style={S.placeLabelsRow}>
                  {[128, 64, 32, 16, 8, 4, 2, 1].map((p, i) => (
                    <div key={i} style={S.placeLabelSmall(i === 0)}>{i === 0 ? `−${p}` : p}</div>
                  ))}
                </div>
              </div>
            </div>
            <p style={S.captionDivider}>
              Type a magnitude and flip the +/− toggle, or click any bit directly — both sides stay in sync.
              The leftmost bit is the <strong>sign bit</strong>; flipping it swings the value by −128.
            </p>
          </div>
        </div>
      );
    }

    function TcBitsDisplay({ S, bits, changed, markSign = true }) {
      return (
        <div style={S.bitsRow}>
          {bits.map((b, i) => (
            <div key={i} style={S.bitCellStatic(b === 1, markSign && i === 0, changed ? changed[i] : false)}>
              {b}
            </div>
          ))}
        </div>
      );
    }

    function TcSignCallout({ S }) {
      return (
        <div style={S.signCalloutRow}>
          <div style={S.signCalloutItem}>
            <span style={S.signCalloutLabel}>sign bit</span>
            <span style={S.signCalloutArrow}>↓</span>
          </div>
          {Array.from({ length: 7 }).map((_, i) => <div key={i} style={{ flex: 1 }} />)}
        </div>
      );
    }

    function TcColumnCallout({ S, index, count = 8, children }) {
      return (
        <div style={S.columnCalloutRow}>
          {Array.from({ length: count }).map((_, i) => (
            i === index ? (
              <div key={i} style={S.columnCalloutItem}>
                <span style={S.columnCalloutLabel}>{children}</span>
                <span style={S.columnCalloutArrow}>↓</span>
              </div>
            ) : <div key={i} style={{ flex: 1 }} />
          ))}
        </div>
      );
    }

    function TcCarryMath({ S, arithmetic }) {
      const { before, carryIn, sum, writeBit, carryOut } = arithmetic;
      return (
        <div>
          <div style={S.carryMathBox}>
            <span style={S.carryMathTerm}>{before}</span>
            <span style={S.carryMathOp}>+</span>
            <span style={S.carryMathTerm}>{carryIn}</span>
            <span style={S.carryMathOp}>=</span>
            <span style={S.carryMathResult}>{sum === 2 ? "10" : sum}</span>
          </div>
          <div style={S.carryMathSub}>write <strong>{writeBit}</strong>, carry <strong>{carryOut}</strong></div>
        </div>
      );
    }

    function TcStepArrow({ S, children }) {
      return (
        <div style={S.recipeArrowWrap}>
          <span style={S.recipeArrowGlyph}>↓</span>
          <span style={S.recipeArrowLabel}>{children}</span>
        </div>
      );
    }

    function TcRecipeExample({ S, label, startDec, showSignCallout }) {
      const startBits = tcDecToBits(startDec);
      const flippedBits = tcFlipBits(startBits);
      const resultBits = tcAddOneBits(flippedBits);
      const resultDec = tcBitsToDec(resultBits);
      const flipChanged = tcDiffBits(startBits, flippedBits);
      const addChanged = tcDiffBits(flippedBits, resultBits);

      return (
        <div style={S.recipeExample}>
          <div style={S.recipeExampleLabel}>{label}</div>
          {showSignCallout && <TcSignCallout S={S} />}
          <div style={S.recipeStepBlock}>
            <div style={S.recipeStepCaption}>start</div>
            <TcBitsDisplay S={S} bits={startBits} />
            <div style={S.recipeStepValue}>= {startDec}</div>
          </div>
          <TcStepArrow S={S}>flip every bit (0↔1)</TcStepArrow>
          <div style={S.recipeStepBlock}>
            <TcBitsDisplay S={S} bits={flippedBits} changed={flipChanged} />
          </div>
          <TcStepArrow S={S}>add 1</TcStepArrow>
          <div style={S.recipeStepBlock}>
            <TcBitsDisplay S={S} bits={resultBits} changed={addChanged} />
            <div style={S.recipeStepValue}>= {resultDec}</div>
          </div>
        </div>
      );
    }

    function TcAddOneExample({ S, label, startDec }) {
      const startBits = tcDecToBits(startDec);
      const resultBits = tcAddOneBits(startBits);
      const changed = tcDiffBits(startBits, resultBits);
      const resultDec = tcBitsToDec(resultBits);

      return (
        <div style={S.recipeExample}>
          <div style={S.recipeExampleLabel}>{label}</div>
          <div style={S.recipeStepBlock}>
            <div style={S.recipeStepCaption}>start</div>
            <TcBitsDisplay S={S} bits={startBits} markSign={false} />
            <div style={S.recipeStepValue}>= {startDec}</div>
          </div>
          <TcStepArrow S={S}>add 1</TcStepArrow>
          <div style={S.recipeStepBlock}>
            <TcBitsDisplay S={S} bits={resultBits} changed={changed} markSign={false} />
            <div style={S.recipeStepValue}>= {resultDec}</div>
          </div>
        </div>
      );
    }

    function TwosComplementExplainer({ S }) {
      return (
        <div style={S.section}>
          <TcSectionHead S={S}>What is two's complement? (ELI5)</TcSectionHead>
          <div style={S.card}>
            <ul style={S.proseList}>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                Computers only have 0s and 1s — there's no minus sign to write down. Two's complement is
                the trick that lets a normal-looking bit pattern <em>mean</em> a negative number.
              </li>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                Think of an odometer that can't show negative miles: roll it back past 0 and it wraps
                around to the highest number instead. Two's complement is that same wraparound, in binary.
              </li>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                The recipe for <strong>−n</strong>: write +n in binary, <strong>flip every bit</strong> (0↔1),
                then <strong>add 1</strong>. Whatever pattern you land on is −n.
              </li>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                That's why the leftmost bit is the <strong>sign bit</strong> — the same one you toggled in
                the converter above. When it's 1, that position counts as <strong>−128</strong> instead of +128.
              </li>
            </ul>
          </div>
        </div>
      );
    }

    function AddOneCarryStepper({ S, startDec }) {
      const steps = tcBuildCarrySteps(startDec);
      const [cur, setCur] = useState(0);
      const step = steps[cur];
      const changed = step.bits.map((_, i) => i === step.highlight);
      const title = step.label === "start" ? "Start" : step.label === "done" ? "Done" : `Processing the ${step.label}`;

      return (
        <div style={S.stepperCard}>
          <div style={S.stepperTitle}>{title}</div>
          {step.carryTarget != null && (
            <TcColumnCallout S={S} index={step.carryTarget}>
              {step.label === "start" ? "+1 enters" : "carry → here"}
            </TcColumnCallout>
          )}
          <TcBitsDisplay S={S} bits={step.bits} changed={changed} markSign={false} />
          <div style={S.stepperValue}>= {tcBitsToDec(step.bits)}</div>
          {step.arithmetic && <TcCarryMath S={S} arithmetic={step.arithmetic} />}
          <p style={S.stepperDesc}>{step.desc}</p>
          <div style={S.stepperNav}>
            <button
              style={{ ...S.stepperBtn, ...(cur === 0 ? S.stepperBtnDisabled : {}) }}
              onClick={() => setCur(c => Math.max(0, c - 1))} disabled={cur === 0}
            >
              ← prev
            </button>
            <div style={S.stepperProgress}>
              <div style={{ ...S.stepperProgressFill, width: `${(cur + 1) / steps.length * 100}%` }} />
            </div>
            <span style={S.stepperBadge}>{cur + 1} / {steps.length}</span>
            <button
              style={{ ...S.stepperBtn, ...(cur === steps.length - 1 ? S.stepperBtnDisabled : {}) }}
              onClick={() => setCur(c => Math.min(steps.length - 1, c + 1))} disabled={cur === steps.length - 1}
            >
              next →
            </button>
          </div>
        </div>
      );
    }

    function AddOneExplainer({ S }) {
      return (
        <div style={S.section}>
          <TcSectionHead S={S}>What happens when we add 1? (carrying)</TcSectionHead>
          <div style={S.card}>
            <ul style={S.proseList}>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                Just like decimal addition carries once a column passes 9 (9 + 1 = 10, carry the 1),
                binary carries too — it just takes far less: a bit only holds 0 or 1.
              </li>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                If a bit is already <strong>1</strong> and you add 1 to it, it flips to <strong>0</strong> and
                carries a 1 into the next position to the left.
              </li>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                That next position does the same check: if it's also a 1, it flips to 0 and passes the
                carry along again. The ripple stops as soon as it lands on a <strong>0</strong>, which
                simply flips to 1 and absorbs it.
              </li>
            </ul>
            <div style={S.recipeBox}>
              <TcAddOneExample S={S} label="Example 1 — no carry" startDec={2} />
              <div style={S.recipeExample}>
                <div style={S.recipeExampleLabel}>Example 2 — step through the carry</div>
                <AddOneCarryStepper S={S} startDec={15} />
              </div>
            </div>
            <p style={S.captionDivider}>
              This is exactly the "add 1" step from the two's complement recipe — the ripple can touch
              several bits, not just the last one. Use the buttons above to walk through it one bit at a time.
            </p>
          </div>
        </div>
      );
    }

    function TwosComplementExamples({ S }) {
      return (
        <div style={S.section}>
          <TcSectionHead S={S}>Two's complement — worked examples</TcSectionHead>
          <div style={S.card}>
            <div style={S.recipeBox}>
              <TcRecipeExample S={S} label="Example 1 — positive → negative" startDec={5} showSignCallout />
              <TcRecipeExample S={S} label="Example 2 — negative → positive (same trick, reversed)" startDec={-5} />
              <TcRecipeExample S={S} label="Example 3 — a bigger magnitude" startDec={18} />
            </div>
            <p style={S.captionDivider}>
              Highlighted boxes show exactly which bits changed in that step. Notice example 2 undoes
              example 1 — flip-and-add-1 is its own reverse, so applying it twice gets you back to start.
            </p>
          </div>
        </div>
      );
    }

    function TwosComplement() {
      const [mode, setMode] = useState("light");
      const T = tcTheme(mode);
      const S = tcStyles(T);
      return (
        <div style={S.wrapper}>
          <div style={S.container}>
            <div style={S.headerRow}>
              <div>
                <div style={S.tag}>BINARY · REFRESHER</div>
                <h1 style={S.h1}>Two's Complement</h1>
                <p style={S.subtitle}>Warm-up: reading binary as decimal, and back again — before signed integers.</p>
              </div>
              <button style={S.themeBtn} onClick={() => setMode(m => m === "dark" ? "light" : "dark")}>
                {mode === "dark" ? "☀ light" : "🌙 dark"}
              </button>
            </div>
            <BinaryIntro S={S} />
            <BinaryDecimalConverter S={S} />
            <TwosComplementExplainer S={S} />
            <AddOneExplainer S={S} />
            <TwosComplementExamples S={S} />
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // VISUALIZER 4 — Decimal → Binary (divide-by-2 method)
    // ─────────────────────────────────────────────────────────────────────────────

    function TcDivideBitsDisplay({ S, bits }) {
      return (
        <div style={S.bitsRow}>
          {bits.map((b, i) => (
            b === null
              ? <div key={i} style={S.bitCellUnknown}>·</div>
              : <div key={i} style={S.bitCellStatic(b === 1, false, false)}>{b}</div>
          ))}
        </div>
      );
    }

    function TcDivideMath({ S, row }) {
      const real = row.dividend / 2;
      const isOdd = row.remainder === 1;
      return (
        <div style={S.divideMathBox}>
          <div style={S.divideMathReal}>{row.dividend} ÷ 2 = {real}</div>
          <div style={S.divideMathBreakdown}>
            <div style={S.divideMathRow}>
              <span style={S.divideMathLabel}>whole number part</span>
              <span style={S.divideMathValue}>{row.quotient}</span>
              <span style={S.divideMathHint}>→ next quotient</span>
            </div>
            <div style={S.divideMathRow}>
              <span style={S.divideMathLabel}>{isOdd ? "leftover (the .5)" : "leftover"}</span>
              <span style={S.divideMathValue}>{row.remainder}</span>
              <span style={S.divideMathHint}>→ remainder</span>
            </div>
          </div>
          <div style={S.divideMathWrite}>so we write: {row.remainder}</div>
        </div>
      );
    }

    function DivideBy2Stepper({ S, startDec }) {
      const rows = tcBuildDivideSteps(startDec);
      const n = rows.length;
      const totalSteps = n + 2; // start + one per division row + done
      const [cur, setCur] = useState(0);

      const revealed = Math.max(0, Math.min(n, cur));
      const bits = Array.from({ length: n }, () => null);
      for (let r = 0; r < revealed; r++) bits[n - 1 - r] = rows[r].remainder;

      let title, desc, row = null, calloutIndex = null;
      if (cur === 0) {
        title = "Start";
        desc = `To convert ${startDec} to binary: divide by 2, write down the remainder, and repeat with ` +
               `the quotient until it reaches 0.`;
      } else if (cur <= n) {
        row = rows[cur - 1];
        calloutIndex = n - cur;
        title = `Step ${cur} of ${n}`;
        desc = row.remainder === 1
          ? `${row.dividend} ÷ 2 = ${row.dividend / 2}. It doesn't split evenly into two whole groups — ` +
            `${row.dividend} is odd, so there's always exactly 1 left over. That leftover is the remainder.`
          : `${row.dividend} ÷ 2 = ${row.dividend / 2}. It splits evenly into two whole groups — ` +
            `${row.dividend} is even, so nothing is left over. The remainder is 0.`;
        if (row.quotient === 0) desc += " The quotient just hit 0 — we're done dividing.";
      } else {
        title = "Done";
        desc = `Quotient reached 0. Reading the remainders bottom-to-top gives ` +
               `${bits.join("")} = ${startDec}.`;
      }

      return (
        <div style={S.stepperCard}>
          <div style={S.stepperTitle}>{title}</div>
          {calloutIndex !== null && (
            <TcColumnCallout S={S} index={calloutIndex} count={n}>remainder → here</TcColumnCallout>
          )}
          <TcDivideBitsDisplay S={S} bits={bits} />
          {row && <TcDivideMath S={S} row={row} />}
          <p style={S.stepperDesc}>{desc}</p>
          <div style={S.stepperNav}>
            <button
              style={{ ...S.stepperBtn, ...(cur === 0 ? S.stepperBtnDisabled : {}) }}
              onClick={() => setCur(c => Math.max(0, c - 1))} disabled={cur === 0}
            >
              ← prev
            </button>
            <div style={S.stepperProgress}>
              <div style={{ ...S.stepperProgressFill, width: `${(cur + 1) / totalSteps * 100}%` }} />
            </div>
            <span style={S.stepperBadge}>{cur + 1} / {totalSteps}</span>
            <button
              style={{ ...S.stepperBtn, ...(cur === totalSteps - 1 ? S.stepperBtnDisabled : {}) }}
              onClick={() => setCur(c => Math.min(totalSteps - 1, c + 1))} disabled={cur === totalSteps - 1}
            >
              next →
            </button>
          </div>
        </div>
      );
    }

    function DivideByTwoExplainer({ S }) {
      return (
        <div style={S.section}>
          <TcSectionHead S={S}>Decimal → binary: divide by 2</TcSectionHead>
          <div style={S.card}>
            <ul style={S.proseList}>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                This is the reverse of "What is binary?" above — there we added place values to get a
                decimal number; here we divide to build the binary back up.
              </li>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                Divide the number by 2. Write down the <strong>remainder</strong> (always 0 or 1) — that's
                one bit.
              </li>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                Keep dividing the <strong>quotient</strong> by 2, the same way, until the quotient reaches 0.
              </li>
              <li style={S.proseListItem}>
                <span style={S.proseListBullet}>›</span>
                Read the remainders from the <strong>last one back to the first</strong> (bottom to top) —
                that sequence is the binary number.
              </li>
            </ul>
            <div style={S.recipeBox}>
              <div style={S.recipeExample}>
                <div style={S.recipeExampleLabel}>Example — converting 41</div>
                <DivideBy2Stepper S={S} startDec={41} />
              </div>
            </div>
            <p style={S.captionDivider}>
              Use the buttons above to walk through each division one step at a time and watch the bits
              fill in from right (first remainder) to left (last remainder).
            </p>
          </div>
        </div>
      );
    }

    function DecimalToBinary() {
      const [mode, setMode] = useState("light");
      const T = tcTheme(mode);
      const S = tcStyles(T);
      return (
        <div style={S.wrapper}>
          <div style={S.container}>
            <div style={S.headerRow}>
              <div>
                <div style={S.tag}>BINARY · CONVERSION</div>
                <h1 style={S.h1}>Decimal → Binary</h1>
                <p style={S.subtitle}>Converting a decimal number into binary using the divide-by-2 method.</p>
              </div>
              <button style={S.themeBtn} onClick={() => setMode(m => m === "dark" ? "light" : "dark")}>
                {mode === "dark" ? "☀ light" : "🌙 dark"}
              </button>
            </div>
            <BinaryIntro S={S} />
            <DivideByTwoExplainer S={S} />
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // MOUNT
    // ─────────────────────────────────────────────────────────────────────────────

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
